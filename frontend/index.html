<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="承脉 AI · 非遗多智能体系统 —— 检索问答、知识图谱、学习路径与活化创作" />
    <title>承脉 AI · 非遗多智能体系统</title>
    <script>
      // 防主题闪烁：React 挂载前按本地偏好落 data-theme（默认暗墨）
      (function () {
        try {
          var t = localStorage.getItem('cm-theme') === 'light' ? 'light' : 'ink'
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

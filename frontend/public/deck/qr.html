<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>承脉 AI · 扫码体验</title>
<style>
  :root{
    --jade-d:#1f5a4a; --jade:#2f7358; --jade2:#4f9078;
    --zhe:#a9722c; --gold:#d9a441; --zhu:#b33a2a;
    --ink:#2c3329; --ink2:#4a4f42; --ink3:#7a7d70;
    --line:rgba(31,90,74,.18);
    --paper:#f3ecdc; --paper2:#ebe2cc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{
    font-family:'Ma Shan Zheng','STKaiti','KaiTi',serif;
    background:#8a8a8a;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;
  }

  /* ---------- A4 纸 ---------- */
  .sheet{
    width:210mm;height:297mm;
    background:
      radial-gradient(120% 80% at 50% 0%, #faf5e9 0%, #f3ecdc 45%, #ece2ca 100%);
    position:relative;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    color:var(--ink);
  }
  /* 绢纹肌理 */
  .sheet::before{
    content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(169,114,44,.04) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(31,90,74,.03) 0 1px, transparent 1px 3px);
  }

  /* ---------- 群山剪影 ---------- */
  .mtn{position:absolute;left:0;right:0;bottom:0;z-index:1;pointer-events:none}
  .mtn svg{display:block;width:100%}

  /* ---------- 顶部装饰条 ---------- */
  .topbar{
    position:absolute;top:0;left:0;right:0;height:14mm;z-index:3;
    background:linear-gradient(180deg, rgba(31,90,74,.92), rgba(31,90,74,.0));
  }
  .brand{
    position:absolute;top:8mm;right:14mm;z-index:4;
    font-size:14px;letter-spacing:.4em;color:var(--jade-d);
    font-family:'Noto Serif SC',serif;
  }
  .seal-corner{
    position:absolute;top:10mm;left:14mm;z-index:4;
    width:16mm;height:16mm;background:var(--zhu);color:#fdf6e6;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;line-height:1.05;text-align:center;font-weight:700;
    border-radius:3mm;box-shadow:0 3px 8px rgba(179,58,42,.35);
    transform:rotate(-4deg);
    font-family:'Ma Shan Zheng',serif;
  }

  /* ---------- 主内容 ---------- */
  .content{
    position:relative;z-index:5;
    height:100%;display:flex;flex-direction:column;align-items:center;
    padding:34mm 16mm 26mm;
    text-align:center;
  }
  .eyebrow{
    font-size:13px;letter-spacing:.6em;color:var(--zhe);
    padding:2mm 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    margin-bottom:8mm;font-family:'Noto Serif SC',serif;
  }
  h1{
    font-size:54px;color:var(--jade-d);line-height:1.15;
    text-shadow:0 2px 0 rgba(255,255,255,.5);
    margin-bottom:4mm;
  }
  h1 .accent{color:var(--zhu)}
  .subtitle{
    font-size:17px;color:var(--ink2);letter-spacing:.12em;
    margin-bottom:10mm;font-family:'Noto Serif SC',serif;
  }
  .subtitle b{color:var(--jade)}

  /* ---------- 二维码区 ---------- */
  .qr-frame{
    position:relative;
    width:110mm;height:110mm;
    background:#fdfbf3;
    border:2px solid var(--jade);
    border-radius:6mm;
    box-shadow:0 10px 30px rgba(31,90,74,.18), inset 0 0 0 6px rgba(217,164,65,.25);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:8mm;
  }
  .qr-frame::before,.qr-frame::after{
    content:'';position:absolute;width:14mm;height:14mm;
    border:2.5px solid var(--gold);
  }
  .qr-frame::before{top:-3mm;left:-3mm;border-right:none;border-bottom:none;border-top-left-radius:3mm}
  .qr-frame::after{bottom:-3mm;right:-3mm;border-left:none;border-top:none;border-bottom-right-radius:3mm}
  .corner-tr,.corner-bl{position:absolute;width:14mm;height:14mm;border:2.5px solid var(--gold)}
  .corner-tr{top:-3mm;right:-3mm;border-left:none;border-bottom:none;border-top-right-radius:3mm}
  .corner-bl{bottom:-3mm;left:-3mm;border-right:none;border-top:none;border-bottom-left-radius:3mm}

  #qr{display:block}

  .url{
    font-size:15px;color:var(--ink2);letter-spacing:.05em;
    font-family:'Noto Serif SC',monospace;
    padding:2mm 6mm;border:1px dashed var(--line);border-radius:999px;
    background:rgba(255,255,255,.4);
  }

  /* ---------- 功能亮点 ---------- */
  .features{
    margin-top:10mm;display:grid;grid-template-columns:repeat(3,1fr);gap:5mm;
    width:100%;max-width:160mm;
  }
  .feat{
    background:rgba(255,253,246,.7);border:1px solid var(--line);
    border-radius:3mm;padding:4mm 3mm;
  }
  .feat .ic{font-size:22px;color:var(--jade);margin-bottom:1.5mm}
  .feat .t{font-size:15px;color:var(--jade-d);margin-bottom:1mm;font-weight:700}
  .feat .d{font-size:11.5px;color:var(--ink3);line-height:1.5;font-family:'Noto Serif SC',serif}

  /* ---------- 底部 ---------- */
  .foot{
    position:absolute;bottom:8mm;left:0;right:0;z-index:5;
    text-align:center;font-size:11px;color:var(--ink3);letter-spacing:.15em;
    font-family:'Noto Serif SC',serif;
  }
  .foot .team{color:var(--zhe);font-weight:700;margin-bottom:1mm}

  /* ---------- 打印按钮（打印时隐藏） ---------- */
  .print-btn{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99;
    background:var(--jade);color:#fff;border:none;padding:12px 36px;
    font-size:16px;border-radius:999px;cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.3);font-family:inherit;letter-spacing:.1em;
  }
  .print-btn:hover{background:var(--jade-d)}

  @media print{
    @page{size:A4 portrait;margin:0}
    body{background:#fff;padding:0;margin:0}
    .sheet{box-shadow:none;width:210mm;height:297mm;margin:0}
    .print-btn{display:none}
  }
</style>
</head>

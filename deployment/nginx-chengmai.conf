# ============================================================
# 承脉 AI Nginx 站点配置
# 用途：80 端口同时托管前端静态页 + 反代后端 API（含 SSE 流式）
# 部署：sudo cp deployment/nginx-chengmai.conf /etc/nginx/sites-available/chengmai
#       sudo ln -sf /etc/nginx/sites-available/chengmai /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# 如已备案并解析域名，把下方 _ 替换为你的域名（如 chengmai.example.com）
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 前端构建产物（npm run build 的输出）
    root /opt/chengmai-ai/frontend/dist;
    index index.html;

    # 上传体积兜底
    client_max_body_size 10m;

    # ---------- 后端 API 反代 ----------
    # 关键：SSE 流式对话必须关闭缓冲，否则文字会攒成一坨最后才出现
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 三件套：关缓冲、关缓存、长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # LLM 生成可能较慢，给足超时（学习路径/创作类接口）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 带指纹的构建资源：永久缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 非遗配图：体积大、内容不变，长缓存 ----------
    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- SPA 路由回退：所有前端路由交给 index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
